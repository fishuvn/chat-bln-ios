[package]
name = "chat_bln_mobile"
version = "3.0.0"
edition = "2021"
description = "Chat BLN — 100% Rust Cross-Platform Mobile Client (iOS 18+)"
authors = ["Nhom 3 Chat BLN"]

[lib]
name = "chat_bln_mobile"
path = "src/lib.rs"

[[bin]]
name = "chat_bln_mobile"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "hooks", "html", "signals", "launch"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
url = "2"
urlencoding = "2"
dirs = "6"

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
desktop = ["dioxus/desktop"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
