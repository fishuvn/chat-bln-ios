name: Build iOS 18+ IPA & Auto-Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Loại tăng phiên bản (auto | patch | minor | major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      explicit_version:
        description: 'Ghi đè phiên bản cụ thể (ví dụ 2.0.0, để trống nếu tự động)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build ChatBLN-iOS18.ipa & Publish Release
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Next Version & Generate Changelog
        id: ver
        run: |
          python3 .github/scripts/compute-release.py \
            --platform "Chat BLN iOS" \
            --bump "${{ inputs.bump_type || 'auto' }}" \
            --explicit-version "${{ inputs.explicit_version || '' }}" \
            --release-notes-out "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --apply-files

      - name: Select Xcode 16+ (iOS 18+ SDK)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build & Package IPA for iOS 18+
        env:
          IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
        run: |
          set -euo pipefail
          mkdir -p dist-ipa build

          if [ -n "$IOS_CERT_BASE64" ] && [ -n "$IOS_PROVISION_BASE64" ] && [ -n "$EXPORT_OPTIONS_PLIST_BASE64" ]; then
            echo "Building Apple-signed IPA v${APP_VERSION} (${APP_BUILD_NUMBER}) from configured secrets..."
            KEYCHAIN_PATH="$RUNNER_TEMP/chatbln-signing.keychain-db"
            KEYCHAIN_PASS="chatbln_temp_kc_pass"
            CERT_PATH="$RUNNER_TEMP/cert.p12"
            PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
            EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"

            echo "$IOS_CERT_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_PLIST"
            mkdir -p "$PROFILE_DIR"
            PROFILE_TMP="$RUNNER_TEMP/profile.mobileprovision"
            echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PROFILE_TMP"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_TMP")")
            cp "$PROFILE_TMP" "$PROFILE_DIR/$UUID.mobileprovision"

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            xcodebuild clean archive \
              -project ChatBLN.xcodeproj \
              -scheme ChatBLN \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/ChatBLN.xcarchive \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              MARKETING_VERSION="${APP_VERSION}" \
              CURRENT_PROJECT_VERSION="${APP_BUILD_NUMBER}" \
              ARCHS=arm64

            xcodebuild -exportArchive \
              -archivePath build/ChatBLN.xcarchive \
              -exportOptionsPlist "$EXPORT_PLIST" \
              -exportPath build/export

            IPA_FOUND=$(ls build/export/*.ipa | head -n 1)
            cp "$IPA_FOUND" dist-ipa/ChatBLN-iOS18.ipa
          else
            echo "Building Release iOS 18+ arm64 IPA v${APP_VERSION} (${APP_BUILD_NUMBER})..."
            xcodebuild clean build \
              -project ChatBLN.xcodeproj \
              -scheme ChatBLN \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              IPHONEOS_DEPLOYMENT_TARGET=18.0 \
              MARKETING_VERSION="${APP_VERSION}" \
              CURRENT_PROJECT_VERSION="${APP_BUILD_NUMBER}" \
              ARCHS=arm64 \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

            APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/ChatBLN.app"
            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: ChatBLN.app was not produced at $APP_PATH"
              exit 1
            fi

            mkdir -p build/ipa/Payload
            cp -R "$APP_PATH" build/ipa/Payload/ChatBLN.app
            (cd build/ipa && zip -qry ../../dist-ipa/ChatBLN-iOS18.ipa Payload)
          fi

          if [ ! -s dist-ipa/ChatBLN-iOS18.ipa ]; then
            echo "ERROR: ChatBLN-iOS18.ipa is missing or empty"
            exit 1
          fi

          cp CHANGELOG.md dist-ipa/CHANGELOG.md
          (cd dist-ipa && shasum -a 256 ChatBLN-iOS18.ipa > SHA256SUMS.txt)

          {
            cat "$RUNNER_TEMP/RELEASE_NOTES.md"
            echo ""
            echo "### 📦 Gói cài đặt iOS (\`v${APP_VERSION}\` — Build \`${APP_BUILD_NUMBER}\`)"
            echo "| File IPA | Hệ điều hành đích | Kiến trúc | Dung lượng |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| \`ChatBLN-iOS18.ipa\` | iOS 18.0+ | \`arm64\` | $(du -h dist-ipa/ChatBLN-iOS18.ipa | cut -f1) |"
            echo ""
            echo "### 🔒 SHA-256 Checksum"
            echo '```text'
            cat dist-ipa/SHA256SUMS.txt
            echo '```'
          } > dist-ipa/FULL_RELEASE_BODY.md

          cat dist-ipa/FULL_RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA (iOS 18+)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-iOS18-IPA-v${{ steps.ver.outputs.version }}
          path: |
            dist-ipa/ChatBLN-iOS18.ipa
            dist-ipa/CHANGELOG.md
            dist-ipa/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit Version & Changelog + Tag Release
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION CHANGELOG.md ChatBLN.xcodeproj/project.pbxproj
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Notice: skipped pushing release commit to main, tagging HEAD directly."
          fi

          git tag -fa "$TAG" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}" --force

      - name: Publish GitHub Release Automatically
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Chat BLN iOS ${{ steps.ver.outputs.tag }}"
          body_path: dist-ipa/FULL_RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-ipa/ChatBLN-iOS18.ipa
            dist-ipa/CHANGELOG.md
            dist-ipa/SHA256SUMS.txt
