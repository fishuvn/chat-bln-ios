name: Build Rust iOS 18+ IPA & Auto-Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Loại tăng phiên bản (auto | patch | minor | major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      explicit_version:
        description: 'Ghi đè phiên bản cụ thể (ví dụ 3.0.0, để trống nếu tự động)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Rust ChatBLN-iOS18.ipa & Publish Release
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository (full history & tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute Next Version & Generate Changelog
        id: ver
        run: |
          python3 .github/scripts/compute-release.py \
            --platform "Chat BLN iOS (Rust)" \
            --bump "${{ inputs.bump_type || 'auto' }}" \
            --explicit-version "${{ inputs.explicit_version || '' }}" \
            --release-notes-out "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --apply-files

      - name: Select Xcode 16+ (iOS 18+ SDK)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up Rust Toolchain (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Run Rust Unit Tests (API, STOMP 1.2 & Update Checker)
        run: cargo test --lib --no-default-features

      - name: Install Dioxus CLI v0.7.10 (dx)
        run: |
          mkdir -p "$HOME/.local/bin"
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            DX_TAR="dx-aarch64-apple-darwin.tar.gz"
          else
            DX_TAR="dx-x86_64-apple-darwin.tar.gz"
          fi
          curl -sSL "https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/${DX_TAR}" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dx" --version

      - name: Build & Package Rust iOS 18+ IPA
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
          IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        run: |
          set -euo pipefail
          export DYLD_FALLBACK_LIBRARY_PATH="$(rustc --print sysroot)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-}"
          mkdir -p dist-dx dist-ipa

          dx bundle --ios --release --target aarch64-apple-ios --package-types ipa --codesign false --out-dir dist-dx || \
          dx bundle --ios --release --target aarch64-apple-ios --package-types ios --codesign false --out-dir dist-dx

          IPA_FOUND=$(find dist-dx target -name "*.ipa" -type f | head -n 1 || true)
          if [ -n "$IPA_FOUND" ]; then
            cp "$IPA_FOUND" dist-ipa/ChatBLN-iOS18.ipa
          else
            APP_FOUND=$(find dist-dx target -name "*.app" -type d | head -n 1 || true)
            if [ -z "$APP_FOUND" ]; then
              echo "ERROR: Neither .ipa nor .app bundle found after dx bundle"
              exit 1
            fi
            mkdir -p build/ipa/Payload
            cp -R "$APP_FOUND" build/ipa/Payload/ChatBLN.app
            (cd build/ipa && zip -qry ../../dist-ipa/ChatBLN-iOS18.ipa Payload)
          fi

          if [ ! -s dist-ipa/ChatBLN-iOS18.ipa ]; then
            echo "ERROR: ChatBLN-iOS18.ipa is missing or empty"
            exit 1
          fi

          cp CHANGELOG.md dist-ipa/CHANGELOG.md
          (cd dist-ipa && shasum -a 256 ChatBLN-iOS18.ipa > SHA256SUMS.txt)

          {
            cat "$RUNNER_TEMP/RELEASE_NOTES.md"
            echo ""
            echo "### 📦 Gói cài đặt iOS 100% Rust (\`v${APP_VERSION}\` — Build \`${APP_BUILD_NUMBER}\`)"
            echo "| File IPA | Hệ điều hành đích | Kiến trúc | Dung lượng |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| \`ChatBLN-iOS18.ipa\` | iOS 18.0+ | \`arm64\` | $(du -h dist-ipa/ChatBLN-iOS18.ipa | cut -f1) |"
            echo ""
            echo "### 🔒 SHA-256 Checksum"
            echo '```text'
            cat dist-ipa/SHA256SUMS.txt
            echo '```'
          } > dist-ipa/FULL_RELEASE_BODY.md

          cat dist-ipa/FULL_RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust IPA (iOS 18+)
        uses: actions/upload-artifact@v4
        with:
          name: ChatBLN-iOS18-Rust-IPA-v${{ steps.ver.outputs.version }}
          path: |
            dist-ipa/ChatBLN-iOS18.ipa
            dist-ipa/CHANGELOG.md
            dist-ipa/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit Version & Changelog + Tag Release
        if: github.event_name != 'pull_request'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION CHANGELOG.md Cargo.toml Dioxus.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Notice: skipped pushing release commit to main."
          fi

          git tag -fa "$TAG" -m "Release ${TAG}"
          for attempt in 1 2 3; do
            git push origin "refs/tags/${TAG}" --force && break
            sleep 2
          done || echo "Notice: action-gh-release will create tag ${TAG} via REST API."

      - name: Publish GitHub Release Automatically
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: main
          name: "Chat BLN iOS ${{ steps.ver.outputs.tag }}"
          body_path: dist-ipa/FULL_RELEASE_BODY.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-ipa/ChatBLN-iOS18.ipa
            dist-ipa/CHANGELOG.md
            dist-ipa/SHA256SUMS.txt
